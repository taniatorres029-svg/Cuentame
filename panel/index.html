<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Seguimiento de pacientes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Panel de la doctora: lista de pacientes a la izquierda (o arriba en celular), detalle con gráfica a la derecha */
:root {
  --band: #15263f; --bg: #faf6f1; --surface: #fff; --line: #e3dace; --fg: #1f2838; --muted: #5f6672; --navy: #15263f;
  --rose: #b26f69; --gold: #a8854b; --soft: #f3ece2; --ok: #2f6b4b; --ok-bg: #e3f1e8; --bad: #9b2f28; --bad-bg: #fbe3e0; --warn: #8a5a12; --warn-bg: #fbeed6;
  --g0: #3e8a5f; --g1: #c9a33a; --g2: #d9772b; --g3: #c0392b;
  --display: 'Cormorant Garamond', Georgia, serif; --body: 'Nunito Sans', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); }
header { background: var(--band); color: #faf6f1; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header .wrap { display: flex; align-items: center; gap: 14px; padding-block: 14px; flex-wrap: wrap; }
header h1 { font: 600 1.6rem/1.1 var(--display); margin: 0; }
header .s { font-size: .62rem; letter-spacing: .24em; text-transform: uppercase; color: #e2b3ae; font-weight: 700; }
header .grow { flex: 1; min-width: 180px; }
button, .btn { font: 700 .92rem var(--body); border-radius: 10px; padding: 9px 14px; cursor: pointer; border: 1.5px solid var(--line); background: var(--surface); color: var(--navy); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
header button { background: transparent; color: #faf6f1; border-color: rgba(255,255,255,.35); }
.btn.wa { background: #1f8f4e; border-color: #1f8f4e; color: #fff; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
main { padding-block: 18px 40px; }
.layout { display: grid; grid-template-columns: 320px 1fr; gap: 18px; align-items: start; }
.layout > * { min-width: 0; }
@media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.list { padding: 6px; max-height: calc(100vh - 140px); overflow: auto; position: sticky; top: 12px; }
@media (max-width: 820px) { .list { max-height: none; position: static; } }
.search { width: 100%; font: 400 .95rem var(--body); padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; margin: 6px 0 8px; background: var(--bg); color: var(--fg); }
.pt { width: 100%; text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; border: 0; border-radius: 10px; padding: 10px 12px; background: transparent; font-weight: 400; }
.pt:hover { background: var(--soft); }
.pt[aria-current="true"] { background: var(--soft); box-shadow: inset 3px 0 0 var(--rose); }
.pt .n { font-weight: 800; color: var(--navy); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pt .m { grid-column: 1 / -1; color: var(--muted); font-size: .82rem; }
.chip { font-size: .7rem; font-weight: 800; padding: 2px 8px; border-radius: 99px; white-space: nowrap; align-self: center; }
.chip.bad { background: var(--bad-bg); color: var(--bad); } .chip.warn { background: var(--warn-bg); color: var(--warn); } .chip.ok { background: var(--ok-bg); color: var(--ok); } .chip.mute { background: var(--soft); color: var(--muted); }
.detail { padding: 18px 20px; }
.dh { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.dh h2 { font: 600 1.9rem/1.1 var(--display); color: var(--navy); margin: 0; }
.dh .grow { flex: 1; min-width: 200px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 10px 0 4px; color: var(--muted); font-size: .9rem; }
.facts b { color: var(--fg); font-variant-numeric: tabular-nums; }
.tx-form { margin: 12px 0 0; }
.tx-form label { display: block; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 800; color: var(--muted); margin-bottom: 4px; }
.tx-row { display: flex; gap: 8px; }
.tx-row input { flex: 1; min-width: 0; font: 400 .95rem var(--body); padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg); }
#txmsg { font-size: .8rem; }
.pt .m.tx { color: var(--rose); font-weight: 700; }
.alert { background: var(--bad-bg); color: var(--bad); border-radius: 12px; padding: 10px 14px; margin: 12px 0 0; font-weight: 700; }
h3 { font: 600 1.25rem var(--display); color: var(--navy); margin: 22px 0 8px; }
.chartbox { position: relative; height: 320px; }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.toggles button { padding: 5px 10px; font-size: .8rem; border-radius: 99px; display: inline-flex; gap: 6px; align-items: center; }
.toggles button i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.toggles button[aria-pressed="false"] { opacity: .45; }
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .85rem; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
th { font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 800; background: var(--soft); position: sticky; top: 0; }
td.l, th.l { text-align: left; }
td.nota { text-align: left; white-space: normal; min-width: 220px; color: var(--muted); }
.g { display: inline-grid; place-items: center; width: 26px; height: 22px; border-radius: 6px; font-weight: 800; font-size: .8rem; color: #fff; }
.g0 { background: transparent; color: var(--muted); font-weight: 600; } .g1 { background: var(--g1); } .g2 { background: var(--g2); } .g3 { background: var(--g3); }
tr.al td { background: #fdf3f2; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }
.login { max-width: 420px; margin: 40px auto; padding: 24px; }
.login h2 { font: 600 1.6rem var(--display); color: var(--navy); margin: 0 0 6px; }
.login input { width: 100%; font: 400 1rem var(--body); padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; margin: 6px 0 14px; }
.login button { width: 100%; justify-content: center; background: var(--band); color: #fff; border-color: var(--band); padding: 12px; }
.err { color: var(--bad); font-weight: 700; }
.muted { color: var(--muted); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<header><div class="wrap">
  <div class="grow"><h1>Seguimiento de pacientes</h1><div class="s">Dra. Tania Torres · Oncología médica</div></div>
  <button id="refresh" type="button" hidden>Actualizar</button>
  <button id="logout" type="button" hidden>Salir</button>
</div></header>
<main class="wrap" id="app"><div class="empty">Cargando…</div></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(function () {
  // Misma dirección que BASE_URL en la app de pacientes
  const BASE_URL = '';
  const SINT = ['Cansancio', 'Náusea', 'Vómito', 'Diarrea', 'Estreñimiento', 'Dolor', 'Boca', 'Apetito'];
  const COLORS = ['#15263f', '#b26f69', '#a8854b', '#2e7d8c', '#7a5c99', '#c0392b', '#d9772b', '#3e8a5f'];
  const KEYSTORE = 'panel-cuentame-clave';
  const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  const app = document.getElementById('app');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = iso => { if (!iso) return '–'; const [y, m, d] = String(iso).slice(0, 10).split('-'); return +d + ' ' + MES[+m - 1] + (y !== String(new Date().getFullYear()) ? ' ' + y : ''); };
  const todayISO = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
  const daysAgo = iso => Math.round((new Date(todayISO() + 'T12:00') - new Date(iso + 'T12:00')) / 864e5);
  const fmtTel = c => c && c.length === 10 ? c.slice(0, 2) + ' ' + c.slice(2, 6) + ' ' + c.slice(6) : (c || '');

  let clave = ''; try { clave = localStorage.getItem(KEYSTORE) || ''; } catch (e) {}
  let pacientes = [], sel = null, chart = null, ocultos = new Set(), tratamientos = {};

  function login(msg) {
    document.getElementById('refresh').hidden = true; document.getElementById('logout').hidden = true;
    if (!BASE_URL) { app.innerHTML = `<div class="card login"><h2>Falta conectar la base</h2><p class="muted">Todavía no está puesta la dirección de tu hoja de Google. En cuanto la tengamos, aquí verás las respuestas.</p></div>`; return; }
    app.innerHTML = `<form class="card login" id="f"><h2>Entrar</h2><p class="muted">Escribe la clave que pusiste en tu hoja de Google. Se guarda en este navegador.</p>
      ${msg ? `<p class="err">${msg}</p>` : ''}<label for="k"><b>Clave</b></label><input id="k" type="password" autocomplete="current-password" required><button type="submit">Ver respuestas</button></form>`;
    document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); clave = document.getElementById('k').value.trim(); try { localStorage.setItem(KEYSTORE, clave); } catch (x) {} cargar(); });
  }

  async function cargar() {
    if (!BASE_URL || !clave) return login();
    app.innerHTML = '<div class="empty">Cargando respuestas…</div>';
    let data;
    try { const r = await fetch(BASE_URL + '?clave=' + encodeURIComponent(clave)); data = await r.json(); }
    catch (e) { app.innerHTML = '<div class="card empty"><p class="err">No pude leer tu hoja de Google.</p><p>Revisa tu internet y toca "Actualizar".</p></div>'; document.getElementById('refresh').hidden = false; return; }
    if (!data.ok) { try { localStorage.removeItem(KEYSTORE); } catch (e) {} clave = ''; return login('La clave no es correcta.'); }
    document.getElementById('refresh').hidden = false; document.getElementById('logout').hidden = false;
    tratamientos = data.tratamientos || {};
    agrupar(data.cols, data.filas); render();
  }

  function agrupar(cols, filas) {
    const ix = n => cols.indexOf(n);
    const map = new Map();
    filas.forEach(f => {
      const cel = String(f[ix('Celular')] || '').replace(/\D/g, ''), nombre = String(f[ix('Nombre')] || '').trim();
      const id = cel || nombre.toLowerCase() || 'sin-nombre';
      const r = { recibido: f[ix('Recibido')], fecha: String(f[ix('Fecha')] || '').slice(0, 10), quimio: String(f[ix('Última quimio')] || '').slice(0, 10), dia: f[ix('Día post-quimio')],
        s: Object.fromEntries(SINT.map(k => [k, f[ix(k)] === '' ? null : Number(f[ix(k)])])), fiebre: f[ix('Fiebre')], nota: f[ix('Nota')], alarma: f[ix('Alarma')] === 'SÍ' };
      if (!map.has(id)) map.set(id, { id, nombre, cel, regs: {} });
      const p = map.get(id); if (nombre) p.nombre = nombre;
      p.regs[r.fecha] = r; // si contestó dos veces el mismo día, queda la última
    });
    pacientes = [...map.values()].map(p => { p.lista = Object.values(p.regs).sort((a, b) => a.fecha.localeCompare(b.fecha)); p.ult = p.lista[p.lista.length - 1]; return p; })
      .sort((a, b) => (b.ult.alarma - a.ult.alarma) || b.ult.fecha.localeCompare(a.ult.fecha));
    if (!sel || !pacientes.find(p => p.id === sel)) sel = pacientes[0] && pacientes[0].id;
  }

  function chipDe(p) {
    const d = daysAgo(p.ult.fecha);
    if (p.ult.alarma && d <= 2) return '<span class="chip bad">Alarma</span>';
    if (d === 0) return '<span class="chip ok">Hoy</span>';
    if (d <= 3) return `<span class="chip warn">Hace ${d} d</span>`;
    return `<span class="chip mute">Hace ${d} d</span>`;
  }

  function render() {
    if (!pacientes.length) { app.innerHTML = '<div class="card empty"><h3>Aún no hay respuestas</h3><p>Cuando un paciente termine sus preguntas en Cuéntame cómo estás, aparecerá aquí.</p></div>'; return; }
    app.innerHTML = `<div class="layout"><div class="card list"><input class="search" id="q" placeholder="Buscar paciente" aria-label="Buscar paciente"><div id="pts"></div></div><div class="card detail" id="det"></div></div>`;
    document.getElementById('q').addEventListener('input', pintaLista);
    pintaLista(); pintaDetalle();
  }
  function pintaLista() {
    const q = (document.getElementById('q').value || '').toLowerCase();
    document.getElementById('pts').innerHTML = pacientes.filter(p => !q || p.nombre.toLowerCase().includes(q) || p.cel.includes(q)).map(p =>
      `<button class="pt" type="button" data-id="${esc(p.id)}" aria-current="${p.id === sel}"><span class="n">${esc(p.nombre || 'Sin nombre')}</span>${chipDe(p)}
        ${tratamientos[p.id] ? `<span class="m tx">${esc(tratamientos[p.id])}</span>` : ''}<span class="m">Última respuesta ${fmt(p.ult.fecha)}${p.ult.dia !== '' && p.ult.dia != null ? ' · día ' + p.ult.dia + ' post-quimio' : ''}</span></button>`).join('') || '<p class="muted" style="padding:10px">Sin resultados.</p>';
  }
  function pintaDetalle() {
    const p = pacientes.find(x => x.id === sel); if (!p) return;
    const u = p.ult, grados = SINT.filter(k => u.s[k] > 0).map(k => k + ' G' + u.s[k]);
    const wa = p.cel ? `https://wa.me/52${p.cel}?text=${encodeURIComponent('Hola ' + (p.nombre.split(' ')[0] || '') + ', soy la Dra. Tania Torres. Vi tus respuestas, ')}` : '';
    document.getElementById('det').innerHTML = `
      <div class="dh"><div class="grow"><h2>${esc(p.nombre || 'Sin nombre')}</h2>
        <div class="facts"><span>Celular <b>${esc(fmtTel(p.cel)) || '–'}</b></span><span>Última quimio <b>${fmt(u.quimio)}</b></span><span>Respuestas <b>${p.lista.length}</b></span><span>Última <b>${fmt(u.fecha)}</b></span></div></div>
        ${wa ? `<a class="btn wa" target="_blank" rel="noopener" href="${wa}">Escribirle por WhatsApp</a>` : ''}</div>
      <form class="tx-form" id="txf"><label for="tx">Tratamiento</label>
        <div class="tx-row"><input id="tx" maxlength="300" placeholder="Ej. FOLFOX ciclo 4, cada 14 días" value="${esc(tratamientos[p.id] || '')}"><button type="submit">Guardar</button></div>
        <span class="muted" id="txmsg"></span></form>
      ${u.alarma ? `<div class="alert">Señal de alarma el ${fmt(u.fecha)}: ${esc([u.fiebre && u.fiebre !== 'No' && u.fiebre !== 'No medida' ? 'fiebre ' + u.fiebre : ''].concat(grados).filter(Boolean).join(', '))}</div>` : ''}
      <h3>Evolución de síntomas</h3>
      <div class="toggles" id="tg">${SINT.map((k, i) => `<button type="button" data-s="${k}" aria-pressed="${!ocultos.has(k)}"><i style="background:${COLORS[i]}"></i>${k}</button>`).join('')}</div>
      <div class="chartbox"><canvas id="ch" aria-label="Gráfica de síntomas por fecha"></canvas></div>
      <div class="legend"><span>0 = sin síntoma · 1 a 3 = grado CTCAE v5</span><span>Debajo de cada fecha: día post-quimio</span></div>
      <h3>Respuestas por fecha</h3>
      <div class="tw"><table><thead><tr><th class="l">Fecha</th><th>Día</th>${SINT.map(k => `<th>${k}</th>`).join('')}<th>Fiebre</th><th class="l">Nota</th></tr></thead><tbody>
        ${p.lista.slice().reverse().map(r => `<tr class="${r.alarma ? 'al' : ''}"><td class="l">${fmt(r.fecha)}</td><td>${r.dia === '' || r.dia == null ? '–' : r.dia}</td>
          ${SINT.map(k => r.s[k] == null ? '<td>–</td>' : `<td><span class="g g${r.s[k]}">${r.s[k]}</span></td>`).join('')}
          <td>${esc(r.fiebre || '–')}</td><td class="nota">${esc(r.nota || '')}</td></tr>`).join('')}</tbody></table></div>`;
    dibuja(p);
  }
  function dibuja(p) {
    if (chart) { chart.destroy(); chart = null; }
    if (typeof Chart === 'undefined') { document.querySelector('.chartbox').innerHTML = '<p class="muted">No se pudo cargar la gráfica.</p>'; return; }
    const css = getComputedStyle(document.documentElement);
    const labels = p.lista.map(r => [fmt(r.fecha), r.dia === '' || r.dia == null ? '' : 'día ' + r.dia]);
    chart = new Chart(document.getElementById('ch'), {
      type: 'line',
      data: { labels, datasets: SINT.map((k, i) => ({ label: k, data: p.lista.map(r => r.s[k]), borderColor: COLORS[i], backgroundColor: COLORS[i], tension: 0, spanGaps: true, pointRadius: 4, borderWidth: 2, hidden: ocultos.has(k) })) },
      options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
        plugins: { legend: { display: false }, tooltip: { callbacks: { title: it => labels[it[0].dataIndex].filter(Boolean).join(' · '), label: c => ` ${c.dataset.label}: ${c.parsed.y === 0 ? 'sin síntoma' : 'G' + c.parsed.y}` } } },
        scales: { y: { min: 0, max: 3, ticks: { stepSize: 1, callback: v => v === 0 ? '0' : 'G' + v, color: css.getPropertyValue('--muted') }, grid: { color: '#eee6db' } },
          x: { ticks: { color: css.getPropertyValue('--muted') }, grid: { display: false } } } }
    });
  }

  app.addEventListener('submit', e => {
    if (e.target.id !== 'txf') return; e.preventDefault();
    const p = pacientes.find(x => x.id === sel); if (!p) return;
    const t = document.getElementById('tx').value.trim(), msg = document.getElementById('txmsg');
    msg.textContent = 'Guardando…';
    fetch(BASE_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ tipo: 'tratamiento', clave, id: p.id, nombre: p.nombre, tratamiento: t }) })
      .then(() => { tratamientos[p.id] = t; msg.textContent = 'Guardado'; pintaLista(); }, () => { msg.textContent = 'No se pudo guardar. Revisa tu internet.'; });
  });
  app.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.id) { sel = b.dataset.id; pintaLista(); pintaDetalle(); if (window.innerWidth <= 820) document.getElementById('det').scrollIntoView({ behavior: 'smooth' }); }
    if (b.dataset.s) { const k = b.dataset.s; ocultos.has(k) ? ocultos.delete(k) : ocultos.add(k); b.setAttribute('aria-pressed', !ocultos.has(k)); const i = SINT.indexOf(k); if (chart) { chart.setDatasetVisibility(i, !ocultos.has(k)); chart.update(); } }
  });
  document.getElementById('refresh').addEventListener('click', cargar);
  document.getElementById('logout').addEventListener('click', () => { try { localStorage.removeItem(KEYSTORE); } catch (e) {} clave = ''; login(); });
  cargar();
})();
</script>
</body>
</html>
